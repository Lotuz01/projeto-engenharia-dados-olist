[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-clima-logistica"
version = "0.1.0"
description = "Pipeline de dados para explorar clima e atrasos de entrega no dataset Olist."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "streamlit>=1.41",
  "plotly>=5.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
olist_clima = []
